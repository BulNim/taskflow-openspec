<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow - 칸반</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
<style>
  .snap-x-mandatory { scroll-snap-type: x mandatory; }
  .snap-start-always { scroll-snap-align: start; scroll-snap-stop: always; }
  .no-bar { -ms-overflow-style: none; scrollbar-width: none; }
  .no-bar::-webkit-scrollbar { display: none; }
</style>
</head>

<body class="bg-page dark:bg-canvas text-ink dark:text-fg font-sans antialiased min-h-screen flex flex-col">

<header class="sticky top-0 z-30 bg-white dark:bg-canvas border-b border-line dark:border-edge">
  <div class="max-w-7xl mx-auto px-4 h-14 flex items-center gap-3">
    <button id="burger" class="md:hidden w-8 h-8 -ml-1 grid place-items-center rounded-lg hover:bg-page dark:hover:bg-edge" aria-label="메뉴">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="hidden md:flex items-center gap-2 shrink-0">
      <div class="w-7 h-7 rounded-lg bg-ink dark:bg-fg grid place-items-center text-white dark:text-canvas font-extrabold text-sm">T</div>
      <span class="font-extrabold tracking-tight">TaskFlow</span>
      <span class="text-ink-3 dark:text-dim px-1">/</span>
    </div>
    <button class="flex items-center gap-1.5 text-sm font-bold md:font-semibold hover:text-blue-text dark:hover:text-blue-dot transition">
      Frontiers<span class="hidden sm:inline"> 팀</span>
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <nav class="hidden md:flex items-center gap-1 ml-3">
      <a class="px-3 py-1.5 rounded-lg text-sm font-bold bg-ink dark:bg-fg text-white dark:text-canvas">칸반</a>
      <a class="px-3 py-1.5 rounded-lg text-sm font-semibold text-ink-2 dark:text-dim hover:bg-page dark:hover:bg-edge transition">채팅</a>
      <a class="px-3 py-1.5 rounded-lg text-sm font-semibold text-ink-2 dark:text-dim hover:bg-page dark:hover:bg-edge transition">멤버</a>
    </nav>
    <div class="ml-auto flex items-center gap-2" id="themeSlot"></div>
    <div class="w-7 h-7 rounded-full bg-blue-dot shrink-0"></div>
    <span class="hidden lg:block text-sm text-ink-2 dark:text-dim">user@ex.com</span>
  </div>
  <div class="md:hidden px-3 pb-2">
    <div id="indicator" class="grid grid-cols-3 gap-1.5"></div>
  </div>
</header>

<!-- 모바일 햄버거 메뉴 -->
<div id="menu" class="hidden fixed inset-0 z-50">
  <div class="absolute inset-0 bg-black/40" data-close></div>
  <nav class="absolute left-0 top-0 bottom-0 w-64 bg-white dark:bg-surface p-4 flex flex-col gap-1">
    <div class="flex items-center gap-2 mb-4 px-1">
      <div class="w-7 h-7 rounded-lg bg-ink dark:bg-fg grid place-items-center text-white dark:text-canvas font-extrabold text-sm">T</div>
      <span class="font-extrabold">TaskFlow</span>
    </div>
    <a class="px-3 py-2.5 rounded-xl text-sm font-bold bg-ink dark:bg-fg text-white dark:text-canvas">칸반</a>
    <a class="px-3 py-2.5 rounded-xl text-sm font-semibold text-ink-2 dark:text-dim">채팅</a>
    <a class="px-3 py-2.5 rounded-xl text-sm font-semibold text-ink-2 dark:text-dim">멤버</a>
    <div class="mt-auto pt-4 border-t border-line dark:border-edge">
      <p class="px-3 text-[12px] text-ink-3 dark:text-dim">user@ex.com</p>
      <button class="w-full mt-2 px-3 py-2.5 rounded-xl text-left text-sm font-bold text-red-text dark:text-red-dot">로그아웃</button>
    </div>
  </nav>
</div>

<div class="max-w-7xl w-full mx-auto px-3 sm:px-4 pt-4 pb-3 flex items-center gap-2">
  <div class="inline-flex gap-1.5 text-xs">
    <button class="px-3 py-1.5 rounded-full font-bold bg-ink dark:bg-fg text-white dark:text-canvas">전체</button>
    <button class="px-3 py-1.5 rounded-full font-bold bg-white dark:bg-chip border border-line dark:border-edge text-ink-2 dark:text-dim">@me</button>
    <button class="px-3 py-1.5 rounded-full font-bold bg-white dark:bg-chip border border-line dark:border-edge text-ink-2 dark:text-dim">미할당</button>
  </div>
  <button class="ml-auto flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-white dark:bg-chip dark:text-fg border border-line dark:border-edge hover:border-ink dark:hover:border-dim transition">
    <span class="hidden sm:inline">정렬: </span>최근 생성순
    <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
  </button>
</div>

<main class="flex-1 w-full max-w-7xl mx-auto pb-24 md:pb-10">
  <div id="board" class="flex md:grid md:grid-cols-3 gap-3 md:gap-4 px-3 sm:px-4
                         overflow-x-auto md:overflow-visible snap-x-mandatory md:snap-none no-bar"></div>
  <div id="alt" class="px-3 sm:px-4"></div>
</main>

<button id="fab" class="md:hidden fixed bottom-5 right-5 z-40 w-14 h-14 rounded-full bg-ink dark:bg-fg text-white dark:text-canvas
               shadow-lg grid place-items-center active:scale-95 transition" aria-label="카드 추가">
  <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- 상태 변경 시트 (모바일 길게 누르기) -->
<div id="sheet" class="hidden fixed inset-0 z-50">
  <div class="absolute inset-0 bg-black/40" data-close></div>
  <div class="absolute inset-x-0 bottom-0 rounded-t-2xl bg-white dark:bg-surface p-4 pb-7">
    <div class="w-9 h-1 rounded-full bg-line dark:bg-edge mx-auto mb-4"></div>
    <p id="sheetTitle" class="text-sm font-bold mb-3 px-1"></p>
    <div class="space-y-1.5">
      <button class="w-full text-left px-4 py-3 rounded-xl bg-page dark:bg-chip border-l-[6px] border-blue-dot   text-sm font-bold">TODO 로 이동</button>
      <button class="w-full text-left px-4 py-3 rounded-xl bg-page dark:bg-chip border-l-[6px] border-orange-dot text-sm font-bold">DOING 으로 이동</button>
      <button class="w-full text-left px-4 py-3 rounded-xl bg-page dark:bg-chip border-l-[6px] border-green-dot  text-sm font-bold">DONE 으로 이동</button>
    </div>
    <button data-close class="w-full mt-3 px-4 py-3 rounded-xl text-sm font-bold text-ink-2 dark:text-dim">취소</button>
  </div>
</div>

<!-- 카드 상세 모달 -->
<div id="modal" class="hidden fixed inset-0 z-50 grid place-items-center px-4">
  <div class="absolute inset-0 bg-black/40" data-close></div>
  <div class="relative w-full max-w-[440px] rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge p-5">
    <div class="flex items-start gap-2 mb-4">
      <div>
        <p class="text-[11px] font-mono text-ink-3 dark:text-dim">#110</p>
        <h2 class="text-base font-extrabold mt-0.5">JWT 미들웨어 구현</h2>
      </div>
      <button data-close class="ml-auto w-7 h-7 grid place-items-center rounded-lg text-ink-3 hover:bg-page dark:hover:bg-edge">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="space-y-3">
      <div>
        <label class="block text-xs font-bold mb-1.5">제목</label>
        <input value="JWT 미들웨어 구현" class="w-full h-11 px-3.5 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-sm focus:outline-none focus:border-blue-dot transition">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold mb-1.5">상태</label>
          <select class="w-full h-11 px-3 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-sm focus:outline-none focus:border-blue-dot">
            <option>TODO</option><option selected>DOING</option><option>DONE</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold mb-1.5">담당자</label>
          <select class="w-full h-11 px-3 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-sm focus:outline-none focus:border-blue-dot">
            <option selected>@me</option><option>@leader</option><option>미할당</option>
          </select>
        </div>
      </div>
      <div class="rounded-xl bg-page dark:bg-chip px-3.5 py-2.5">
        <p class="text-[11px] text-ink-3 dark:text-dim">생성 2026-08-05 14:02  ·  수정 2026-08-06 09:31  ·  생성자 @me</p>
      </div>
    </div>
    <div id="modalBtns" class="flex gap-2 mt-4"></div>
  </div>
</div>

<!-- 삭제 확인 -->
<div id="confirm" class="hidden fixed inset-0 z-50 grid place-items-center px-4">
  <div class="absolute inset-0 bg-black/40" data-close></div>
  <div class="relative w-full max-w-[360px] rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge border-l-[6px] border-l-red-dot p-5">
    <h2 class="text-sm font-extrabold text-red-text dark:text-red-dot">카드를 삭제할까요</h2>
    <p class="text-[12px] text-ink-2 dark:text-dim mt-1">#110 JWT 미들웨어 구현 · 되돌릴 수 없음</p>
    <div class="flex gap-2 mt-4">
      <button data-close class="flex-1 h-11 rounded-xl bg-white dark:bg-chip border border-line dark:border-edge text-sm font-bold">취소</button>
      <button class="flex-1 h-11 rounded-xl bg-red-dot text-white text-sm font-bold">삭제</button>
    </div>
  </div>
</div>

<script>
  document.getElementById("themeSlot").innerHTML = window.THEME_BTN;
  const S = window.STRIPE, L = window.LABEL;

  const THEME = {
    TODO:  { stripe:S.blue,   label:L.blue,   badge:"border-l-[3px] border-l-blue-dot   dark:border-l-blue-dot" },
    DOING: { stripe:S.orange, label:L.orange, badge:"border-l-[3px] border-l-orange-dot dark:border-l-orange-dot" },
    DONE:  { stripe:S.green,  label:L.green,  badge:"border-l-[3px] border-l-green-dot  dark:border-l-green-dot" }
  };

  // 실제 연동 시 GET /api/teams/{id}/tasks 응답으로 교체
  const FULL = {
    TODO:  [{id:100,t:"DB 마이그레이션 작성",a:"@me"},
            {id:101,t:"초대 코드 만료 정책",a:"@leader"},
            {id:102,t:"에러 응답 표준화",a:null}],
    DOING: [{id:110,t:"JWT 미들웨어 구현",a:"@me"},
            {id:111,t:"칸반 드래그 핸들러",a:"@me"}],
    DONE:  [{id:120,t:"signup API + bcrypt",a:"@me"},
            {id:121,t:"팀 생성 + 초대 코드",a:"@leader"}]
  };
  const EMPTY = { TODO:[], DOING:[], DONE:[] };

  const board = document.getElementById("board");
  const indicator = document.getElementById("indicator");

  const card = (t, th, extra = "") => `
    <article draggable="true" data-id="${t.id}" data-title="${t.t}"
      class="js-card select-none cursor-grab rounded-xl bg-white dark:bg-surface border border-line dark:border-edge
             ${th.stripe} px-3.5 py-3 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-150 ${extra}">
      <h3 class="text-[14px] font-bold leading-snug text-ink dark:text-fg">${t.t}</h3>
      <div class="mt-1.5 flex items-center gap-2 text-[11px] font-semibold">
        <span class="font-mono text-ink-3 dark:text-dim">#${t.id}</span>
        <span class="text-ink-3 dark:text-dim">&middot;</span>
        ${t.a
          ? `<span class="${th.label}">${t.a}</span>`
          : `<span class="px-1.5 py-0.5 rounded bg-page dark:bg-chip text-ink-3 dark:text-dim">미할당</span>`}
      </div>
    </article>`;

  const draw = (data, opts = {}) => {
    board.innerHTML = "";
    indicator.innerHTML = "";
    Object.keys(THEME).forEach((key, i) => {
      const th = THEME[key];
      const list = data[key] || [];
      const isDrop = opts.dropTarget === key;
      const sec = document.createElement("section");
      sec.className = "snap-start-always shrink-0 w-[calc(100vw-1.5rem)] sm:w-[calc(100vw-2rem)] md:w-auto rounded-2xl p-3 transition " +
        (isDrop
          ? "bg-blue-dot/10 border-2 border-dashed border-blue-dot"
          : "bg-black/[.03] dark:bg-white/[.02] border border-line dark:border-edge");
      let inner = list.map((t, ti) =>
        card(t, th, (opts.dragging && key === "DOING" && ti === 0) ? "opacity-30 rotate-2" : "")).join("");
      if (opts.inline && key === "TODO") {
        inner = `<div class="rounded-xl bg-white dark:bg-surface border-2 border-blue-dot px-3.5 py-3">
                   <input value="새 태스크 제목" class="w-full bg-transparent text-[14px] font-bold outline-none">
                   <p class="mt-1.5 text-[11px] text-ink-3 dark:text-dim">Enter 저장  ·  Esc 취소</p>
                 </div>` + inner;
      }
      if (!list.length && !(opts.inline && key === "TODO")) {
        inner = `<div class="grid place-items-center py-10 text-center">
                   <p class="text-xs font-semibold text-ink-3 dark:text-dim">카드 없음</p>
                   <button class="mt-2 text-xs font-bold text-ink dark:text-fg underline">+ 첫 태스크 만들기</button>
                 </div>`;
      }
      sec.innerHTML = `
        <header class="flex items-center gap-2 pb-3">
          <span class="px-2.5 py-1 rounded-md text-[11px] font-extrabold tracking-wide bg-white dark:bg-chip
                       border border-line dark:border-edge ${th.badge} ${th.label}">${key}</span>
          <span class="text-xs font-bold text-ink-3 dark:text-dim">${list.length}</span>
          <button class="ml-auto w-6 h-6 grid place-items-center rounded-md text-ink-3 dark:text-dim hover:bg-white dark:hover:bg-edge transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </header>
        <div class="space-y-2 min-h-[8rem]">${inner}</div>`;
      board.appendChild(sec);

      const b = document.createElement("button");
      b.dataset.i = i; b.textContent = key;
      indicator.appendChild(b);
    });
    syncIndicator();
  };

  const syncIndicator = () => {
    const idx = Math.round(board.scrollLeft / Math.max(1, board.clientWidth));
    [...indicator.children].forEach((b, i) => {
      const th = THEME[Object.keys(THEME)[i]];
      b.className = "py-1.5 rounded-md text-[11px] font-extrabold transition border " +
        (i === idx
          ? `bg-white dark:bg-chip border-line dark:border-edge ${th.badge} ${th.label} shadow-sm`
          : "bg-transparent border-line dark:border-edge text-ink-3 dark:text-dim");
    });
  };
  board.addEventListener("scroll", syncIndicator, { passive:true });
  indicator.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (b) board.children[+b.dataset.i].scrollIntoView({ behavior:"smooth", inline:"start" });
  });

  const hideAll = () => ["menu","sheet","modal","confirm"].forEach(i => document.getElementById(i).classList.add("hidden"));
  document.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) hideAll(); });

  window.initTheme(syncIndicator);

  const alt = document.getElementById("alt");
  const STATES = {
    "normal":  () => { hideAll(); alt.innerHTML = ""; board.classList.remove("hidden"); draw(FULL); },
    "empty":   () => { STATES["normal"](); draw(EMPTY); },
    "inline":  () => { STATES["normal"](); draw(FULL, {inline:true}); },
    "drag":    () => { STATES["normal"](); draw(FULL, {dragging:true, dropTarget:"DONE"}); },
    "modal":   () => {
      STATES["normal"]();
      document.getElementById("modalBtns").innerHTML = `
        <button data-close class="flex-1 h-11 rounded-xl bg-white dark:bg-chip border border-line dark:border-edge text-sm font-bold">취소</button>
        <button class="flex-1 h-11 rounded-xl bg-ink dark:bg-fg text-white dark:text-canvas text-sm font-bold">저장</button>
        <button class="h-11 px-4 rounded-xl bg-red-dot text-white text-sm font-bold">삭제</button>`;
      document.getElementById("modal").classList.remove("hidden");
    },
    "modal-noperm": () => {
      STATES["modal"]();
      document.getElementById("modalBtns").innerHTML = `
        <button data-close class="flex-1 h-11 rounded-xl bg-white dark:bg-chip border border-line dark:border-edge text-sm font-bold">취소</button>
        <button class="flex-1 h-11 rounded-xl bg-ink dark:bg-fg text-white dark:text-canvas text-sm font-bold">저장</button>`;
    },
    "confirm": () => { STATES["normal"](); document.getElementById("confirm").classList.remove("hidden"); },
    "sheet":   () => {
      STATES["normal"]();
      document.getElementById("sheetTitle").textContent = "#110  JWT 미들웨어 구현";
      document.getElementById("sheet").classList.remove("hidden");
    },
    "menu":    () => { STATES["normal"](); document.getElementById("menu").classList.remove("hidden"); },
    "forbidden": () => {
      hideAll();
      board.classList.add("hidden");
      alt.innerHTML = `
        <div class="max-w-[420px] mx-auto mt-10 rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge
                    border-l-[6px] border-l-red-dot p-6 text-center">
          <p class="text-4xl font-black text-red-text dark:text-red-dot">403</p>
          <h2 class="text-base font-extrabold mt-2">이 팀에 접근할 권한이 없음</h2>
          <p class="text-[12px] text-ink-2 dark:text-dim mt-1.5">다른 팀의 URL 을 직접 입력한 경우. 내 팀으로 이동</p>
          <button class="w-full h-11 mt-4 rounded-xl bg-ink dark:bg-fg text-white dark:text-canvas text-sm font-bold">내 칸반으로</button>
        </div>`;
    }
  };

  window.stateBar([
    {key:"normal",       label:"정상"},
    {key:"empty",        label:"빈 칸반"},
    {key:"inline",       label:"인라인 입력"},
    {key:"drag",         label:"드래그 중"},
    {key:"modal",        label:"카드 모달"},
    {key:"modal-noperm", label:"모달 - 삭제 권한 없음"},
    {key:"confirm",      label:"삭제 확인"},
    {key:"sheet",        label:"모바일 시트"},
    {key:"menu",         label:"모바일 메뉴"},
    {key:"forbidden",    label:"403 다른 팀"}
  ], (key) => STATES[key]());

  document.getElementById("burger").onclick = () => document.getElementById("menu").classList.remove("hidden");
  document.getElementById("fab").onclick = () => STATES["inline"]();
</script>
</body>
</html>
